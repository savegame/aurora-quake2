// ОС Аврора: раскладка геймпада по умолчанию (аналог тач-управления).
// Стики (движение/осмотр) обрабатываются напрямую в IN_Move, не бинды.
// Экшены ниже накладываются поверх default.cfg — клавиатура и мышь
// остаются как есть.

bind A "+moveup"
bind X "+movedown"

bind L "weapprev"
bind R "weapnext"

bind LEFT "invprev"
bind RIGHT "invnext"
bind DOWN "invuse"
bind UP "invdrop"

bind SELECT "cmd help"
bind START "togglepause"

bind LSTICK "+speed"
bind RSTICK "+movedown"

bind RTRIGGER "+attack"
