// ОС Аврора: раскладка геймпада по умолчанию (аналог тач-управления).
// Стики (движение/осмотр) обрабатываются напрямую в IN_Move, не бинды.
// Экшены ниже накладываются поверх default.cfg — клавиатура и мышь
// остаются как есть.
// Имена A/B/X/Y/L/R — это кнопки геймпада (K_GAMEPAD_* == заглавные
// ASCII-коды, см. keyboard.h), клавиатурные строчные a/b/x/y/l/r они
// не затрагивают.

bind A "+moveup"      // прыжок / всплыть
bind B "+movedown"    // присесть (в меню B — «назад», зашито в меню)
bind X "+movedown"

bind L "weapprev"     // левое плечо — предыдущее оружие
bind R "weapnext"     // правое плечо — следующее оружие

bind LEFT "invprev"   // D-pad влево/вправо — предметы
bind RIGHT "invnext"
bind UP "invdrop"     // D-pad вверх — выкинуть предмет
bind DOWN "invuse"    // D-pad вниз — использовать предмет

// SELECT (BACK/GUIDE) = F1, help computer: кнопка мапится в K_F1 в
// input_sdl.c (IN_PollControllerButtons), поэтому биндим именно F1.
bind F1 "cmd help"

// START не биндим: в input_sdl.c (IN_AuroraRemapGamepadKey) кнопка START
// шлётся как K_ESCAPE — в игре открывает меню (как ESC), в меню — «назад».
// Бинд здесь перекрыл бы это поведение (в меню menu_main выглядел бы как
// активация пункта).

bind LSTICK "+speed"     // нажатие на левый стик — бег
bind LTRIGGER "+speed"   // левый триггер — бег
bind RSTICK "+movedown"  // нажатие на правый стик — присесть

bind RTRIGGER "+attack"  // правый триггер — огонь
